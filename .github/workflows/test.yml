name: Tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14', '3.15']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra dev
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/search_router/reader/node/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: src/search_router/reader/node
      - run: npm test
        working-directory: src/search_router/reader/node
      - run: uv run ruff check src tests examples
      - run: uv run ruff format --check src tests examples
      - run: uv run pytest -q