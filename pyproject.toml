[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "internet-search-router"
version = "0.1.0"
description = "Free Internet Search Router: quota-aware REST and MCP internet search for agents"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1", "mcp>=1.30,<2", "jsonschema>=4.23,<5",
  "pypdf>=5,<7",
  "cryptography>=44,<47", "keyring>=25,<26",
  "opentelemetry-api>=1.30,<2", "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "pre-commit>=4,<5"]

[project.scripts]
search-router = "search_router.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/search_router"]

[tool.hatch.build]
exclude = ["**/node_modules/**", "reader-output/**"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "docs", ".github", "pyproject.toml", "uv.lock", "README.md", "CONTRIBUTING.md", "Dockerfile", "bootstrap.env.example", ".gitignore", ".dockerignore", ".pre-commit-config.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]